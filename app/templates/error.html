{% extends "base.html" %}

{% block title %}Error - ChurnPredict Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Page Not Found</h4>
            </div>
            <div class="card-body text-center">
                <div class="display-1 text-danger mb-4">
                    <i class="fas fa-search"></i>
                </div>
                <h3>404 Error</h3>
                <p class="text-muted">The page you are looking for doesn't exist.</p>
                
                <div class="mt-4">
                    <a href="/" class="btn btn-primary">
                        <i class="fas fa-home"></i> Go to Home
                    </a>
                    <a href="/dashboard" class="btn btn-outline-success">
                        <i class="fas fa-chart-bar"></i> Go to Dashboard
                    </a>
                    <a href="/about" class="btn btn-outline-info">
                        <i class="fas fa-info-circle"></i> Go to About
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
